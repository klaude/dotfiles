font_family family="Source Code Pro"
bold_font auto
italic_font auto
bold_italic_font auto

enable_audio_bell no

window_padding_width 6

tab_bar_edge top
tab_bar_style separator
tab_separator " | "
tab_bar_margin_width 6.0
active_tab_foreground #181818
active_tab_background #6a9fb5
active_tab_font_style bold
inactive_tab_foreground #6b6b6b
inactive_tab_background #181818
inactive_tab_font_style normal

# Porting colors from the default alcritty theme
# See: man 5 alacritty
foreground #d8d8d8
background #181818

selection_foreground none
selection_background none

# black
color0 #181818
color8 #6b6b6b

# red
color1 #ac4242
color9 #c55555

# green
color2 #90a959
color10 #aac474

# yellow
color3 #f4bf75
color11 #feca88

